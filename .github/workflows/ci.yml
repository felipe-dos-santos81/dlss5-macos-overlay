name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test without model weights
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Verify source and run unit tests
        env:
          DLSS_BUILD_JOBS: "2"
        run: ./scripts/verify-source.sh
